<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px "Fusion Pixel",-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>咪楼 MEELO</title>
<meta name="claude:viewport-fit-sides" content="cover">


<style>
/* Layout: the building is the whole screen; every control hangs off it (roof sign, site sign, floor bar). */
:root{
  --sky-top:#4d6577; --sky-bot:#a3b2bc;
  --panel:#f7f5f0; --panel-2:#ece8df; --ink:#2a2d33; --muted:#6b6f78; --line:#d9d4c8;
  --coral:#ef6b52; --coral-ink:#ffffff; --cream:#f6ecd6; --blue:#3f86c9; --bp:#2f6f9a; --bp-ink:#eaf6ff; --hazard:#e8b13a;
  --display:"Fusion Pixel","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --body:"Fusion Pixel","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono:"Fusion Pixel",Consolas,"Microsoft YaHei",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-top:#1d2733; --sky-bot:#3a4654; --panel:#1f2329; --panel-2:#2a2f37; --ink:#eceae4; --muted:#a3a7ae; --line:#3a4049; color-scheme:dark }}
:root[data-theme="dark"]{
  --sky-top:#1d2733; --sky-bot:#3a4654; --panel:#1f2329; --panel-2:#2a2f37; --ink:#eceae4; --muted:#a3a7ae; --line:#3a4049; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky-bot);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));touch-action:none}
#stage canvas{display:block;width:100%;height:100%;filter:var(--scene-filter,saturate(1.25) contrast(1.16) brightness(1.0))}
#labels,#world{position:absolute;inset:0;pointer-events:none}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

/* floor tags */
.tbtn{position:relative;width:52px;height:52px;border-radius:17px;border:2.5px solid #3b3340;background:#fff8ec;box-shadow:0 4px 0 #3b3340;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .08s}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b3340}
.tbtn.danger{background:#ffe3dc}
.tbtn[data-tip]:hover::after,.tbtn[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#3b3340;color:#fff8ec;font:500 12px var(--body);padding:4px 9px;border-radius:8px;white-space:nowrap;pointer-events:none}
.timew{display:flex;align-items:center;gap:10px;color:#fffaf2;text-shadow:0 2px 0 rgb(40 34 52 / .55),0 0 14px rgb(40 34 52 / .35)}
.tw-time{font:400 46px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tw-date{font:500 13px var(--body);opacity:.95;margin-top:2px}
.tw-date b{font-family:var(--display);font-weight:400;color:#ffd7c9;font-size:15px}
.timew{pointer-events:auto}
.tw-mood{margin-top:5px;border:2px solid rgb(255 250 242 / .85);background:rgb(40 34 52 / .25);color:#fffaf2;font:500 12px var(--body);padding:2px 10px;border-radius:999px;cursor:pointer;text-shadow:none}
.tw-ic svg{filter:drop-shadow(0 2px 0 rgb(40 34 52 / .5))}
#twIcon{display:grid;place-items:center;flex:none;width:56px;height:56px;padding:4px;border:0;background:transparent;box-shadow:none;cursor:default;border-radius:0;pointer-events:none}
#twIcon:hover{background:transparent}
#twIcon:focus-visible{outline:3px solid #ffcf5a;outline-offset:4px}
#menu #hBtn{width:100%;text-align:left}
#nameplate{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:#fff8ec;border:2.5px solid #3b3340;box-shadow:0 4px 0 #3b3340;border-radius:16px;padding:6px 16px 6px 8px;font:400 22px var(--display);color:#3b3340;white-space:nowrap}
#nameplate small{font:500 13px var(--mono);color:#6b6370}
#nameplate::before,#nameplate::after{content:"";position:absolute;top:-16px;width:2px;height:14px;background:#3b3340}
#nameplate::before{left:22%}#nameplate::after{right:22%}
.stage-inroom #topbar{opacity:0}
.flabel{position:absolute;transform:translate(0,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:#fff8ec;border:2px solid #3b3340;border-radius:10px;color:#3b3340;
  padding:3px 9px 3px 4px;font-size:12px;box-shadow:0 3px 0 #3b3340;font-variant-numeric:tabular-nums}
.flabel::before{content:"";position:absolute;left:-12px;top:50%;width:10px;height:2px;background:#3b3340;opacity:.6}
.flabel b{font-weight:700}
.flabel i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.pill.ruin{background:var(--hazard);color:#3a2a00}
.pill.cap{background:var(--blue);color:#fff}
.pill.bp{background:var(--bp);color:var(--bp-ink)}

/* the site sign hanging on the floor under construction */
.site{position:absolute;transform:translate(0,-50%);pointer-events:auto;display:flex;flex-direction:column;gap:8px;
  background:#fff8ec;color:#3b3340;border:2.5px solid #3b3340;border-radius:14px;padding:10px 12px 12px;box-shadow:0 4px 0 #3b3340,0 8px 22px rgb(0 0 0 / .18);min-width:184px;
  border-top:6px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--hazard) 0 9px,#2b2210 9px 18px) 6 0 0 0}
.site::before{content:"";position:absolute;left:-14px;top:50%;width:14px;height:2px;background:var(--hazard)}
.site .hd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.site .hd i{width:10px;height:10px;border-radius:3px}
.site .t{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.site .acts{display:flex;gap:6px}
.site button{flex:1;border:2px solid #3b3340;box-shadow:0 2px 0 #3b3340;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;cursor:pointer;min-height:38px;background:var(--panel-2);color:var(--ink)}
.site button.go{background:var(--ink);color:var(--panel)}

/* roof sign + drawing picker */
.roof{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center}
.roof .post{width:3px;height:16px;background:var(--coral)}
.roofbtn{border:0;background:var(--coral);color:var(--coral-ink);font:400 22px var(--display);padding:8px 16px 7px;border-radius:12px;cursor:pointer;
  box-shadow:0 4px 0 #b9452f,0 8px 18px rgb(0 0 0 / .18);white-space:nowrap}
.roofbtn.bp{background:var(--bp);box-shadow:0 4px 0 #1d4a69,0 8px 18px rgb(0 0 0 / .18)}
.roofbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9452f}
.roof .busy{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.picker{position:absolute;pointer-events:auto;width:min(360px,calc(100% - 32px));background:#fff8ec;color:#3b3340;border:2.5px solid #3b3340;border-radius:18px;padding:14px;
  box-shadow:0 5px 0 #3b3340,0 14px 40px rgb(0 0 0 / .25);display:flex;flex-direction:column;gap:12px}
.picker.bp{background:#dcebf4;color:#173548;
  background-image:linear-gradient(rgb(47 111 154 / .12) 1px,transparent 1px),linear-gradient(90deg,rgb(47 111 154 / .12) 1px,transparent 1px);background-size:16px 16px}
.picker h3{margin:0;font:400 24px var(--display);display:flex;justify-content:space-between;align-items:center}
.picker h3 button{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:inherit;padding:2px 6px}
.sheets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sheet{border:2px solid #3b3340;box-shadow:0 2px 0 #3b3340;background:var(--panel);border-radius:10px;padding:0 0 6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;color:var(--ink);overflow:hidden}
.sheet b{display:none}
.sheet[aria-pressed="true"]{outline:3px solid #ef6b52;outline-offset:1px}
.picker .go{border:2.5px solid #3b3340;box-shadow:0 4px 0 #3b3340;border-radius:12px;padding:11px;font-weight:700;font-size:15px;cursor:pointer;background:var(--coral);color:var(--coral-ink);min-height:44px}
.picker.bp .go{background:var(--bp);color:var(--bp-ink)}
.side{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.side input{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 14px var(--mono);background:var(--panel);color:var(--ink);min-height:36px}
.side input.wide{flex:1;width:auto;font-family:var(--body);min-width:0}
.side button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px;font-size:13px}
.picker.bp .side{color:#38566b}

/* HUD */
#topbar{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#topbar > *{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:var(--coral)}
.brand small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#hud{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;gap:10px;align-items:flex-end}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:500;font-size:13px;cursor:pointer;min-height:40px}
#menu{position:absolute;right:0;bottom:64px;background:#fff8ec;border:2.5px solid #3b3340;border-radius:14px;color:#3b3340;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:200px;box-shadow:0 10px 30px rgb(0 0 0 / .18)}
#menu button,#menu label{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
#menu button:hover,#menu label:hover{background:var(--panel-2)}
#menu p{margin:4px 10px 6px;font-size:11.5px;color:var(--muted);line-height:1.5}
#floorbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none;
}
#floorbar > *{pointer-events:auto}
#floorActs{display:flex;gap:10px}
#floorbar .danger{color:#b8402c;border-color:#e8b3a8}
#hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);max-width:260px;line-height:1.5;pointer-events:none}
/* overlays */
.modal{position:fixed;inset:0;background:rgb(10 14 20 / .45);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.card img{border-radius:12px;width:100%}
.card .row{display:flex;gap:8px}
.card .btn{flex:1;border:0;border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--ink);color:var(--panel);min-height:44px}
.card .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.card .btn.hz{background:var(--hazard);color:#2b2210}
.bigclock{font-family:var(--mono);font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top,0px) + 64px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--ink)}
#loading .bar{width:220px;height:6px;border-radius:3px;background:rgb(255 255 255 / .5);overflow:hidden;margin-top:12px}
#loading .bar div{height:100%;width:0;background:var(--coral);transition:width .2s}
.pop{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font:400 20px var(--display);color:#3b3340;text-shadow:0 1px 0 #fff,0 0 8px #fff;animation:popup 1.4s ease-out forwards;white-space:nowrap}
.pop.up{animation-name:floatup}
.pop.clang{font-size:26px;color:#ffcf3a;text-shadow:0 2px 0 #3b3340,2px 0 0 #3b3340,-2px 0 0 #3b3340,0 -2px 0 #3b3340}
.completion-feedback{position:absolute;pointer-events:none;z-index:3}
.completion-frame{position:absolute;inset:0;border:3px solid #ffe29a;box-shadow:0 0 0 1px #b77d38,0 0 14px #ffe5a855;animation:completion-frame 1.1s ease-out both}
.completion-stamp{position:absolute;right:-12px;top:-20px;padding:5px 11px;background:#fff8dc;border:2px solid #77603f;box-shadow:0 3px 0 #b59153;color:#655034;font:400 18px var(--display);white-space:nowrap;animation:completion-stamp 1.1s ease-out both}
.completion-star{position:absolute;top:12%;width:12px;height:12px;background:#ffdc79;clip-path:polygon(40% 0,60% 0,60% 30%,70% 40%,100% 40%,100% 60%,70% 60%,60% 70%,60% 100%,40% 100%,40% 70%,30% 60%,0 60%,0 40%,30% 40%,40% 30%);animation:completion-star 1.1s ease-out both}
@keyframes completion-frame{0%{opacity:0;transform:scale(1,.975)}18%{opacity:.9;transform:scale(1.012,1.025)}42%{opacity:.8;transform:scale(.998,.993)}65%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes completion-stamp{0%{opacity:0;transform:translateY(9px) scale(.94)}20%{opacity:1;transform:translateY(0) scale(1.04)}40%{transform:translateY(-3px) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
@keyframes completion-star{0%{opacity:0;transform:translate(0,8px) scale(.4)}20%{opacity:1}75%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),-42px) scale(.7)}}
@media(prefers-reduced-motion:reduce){.completion-frame,.completion-stamp,.completion-star{animation:none}.completion-star{display:none}}
.pop .steam{font:700 28px var(--mono);color:#fff;text-shadow:0 0 6px rgb(0 0 0 / .25)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-80%) scale(.7)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-60%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
.hint{position:fixed;transform:translate(14px,-130%);pointer-events:none;z-index:15;background:#fffaf0;color:#3b3340;font:500 12.5px var(--body);padding:5px 10px;border-radius:10px;border:2px solid #3b3340;box-shadow:0 3px 0 #3b3340;white-space:nowrap}
.tools{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(78px,calc(env(safe-area-inset-top,0px) + 70px));bottom:96px;width:min(330px,calc(100% - 32px));overflow:auto;z-index:6;
  background:#fff8ec;color:#3b3340;border:2.5px solid #3b3340;border-radius:20px;box-shadow:0 5px 0 #3b3340,0 16px 40px rgb(0 0 0 / .25);padding:14px;display:flex;flex-direction:column;gap:14px}
.tools header{display:flex;justify-content:space-between;align-items:center}
.tools h3{margin:0;font:400 24px var(--display);display:flex;gap:8px;align-items:center}
.tools .x{border:0;background:transparent;font-size:24px;cursor:pointer;color:inherit}
.tools h4{margin:0 0 8px;font:700 13px var(--body);letter-spacing:.06em}
.tools section{border-top:2px dashed #e0d5c0;padding-top:12px}
.tools .mini{font-size:12px;color:#6b6370;margin:8px 0 0;line-height:1.5}
.pomo{position:relative;display:grid;place-items:center;margin:4px auto}
.pomo b{position:absolute;font:700 26px var(--mono)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools input,.tools a{font:500 13px var(--body);color:#3b3340}
.row2 button,.add button,.chips button,.links a{border:2px solid #3b3340;box-shadow:0 2px 0 #3b3340;background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.row2 .go,.chips button[aria-pressed="true"]{background:#ef6b52;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.todo{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #3b3340;border-radius:10px;padding:5px 8px;font-size:14px}
.todo li span{flex:1;min-width:0;overflow-wrap:anywhere}
.todo li.done span{text-decoration:line-through;opacity:.5}
.todo .ck{width:24px;height:24px;border:2px solid #3b3340;border-radius:7px;background:#fff8ec;cursor:pointer;font-weight:700;padding:0}
.todo li.done .ck{background:#5fae3e;color:#fff}
.todo .rm{border:0;background:transparent;cursor:pointer;font-size:16px;color:#9a8f86}
.add{display:flex;gap:6px}.add input,.row2 input{flex:1;min-width:0;border:2px solid #3b3340;border-radius:10px;padding:7px 9px;background:#fff;min-height:36px}
.stations{list-style:none;margin:0 0 10px;padding:0 0 0 14px;border-left:4px solid #4f8fd6;display:flex;flex-direction:column;gap:6px}
.stations li{position:relative;font-size:14px}.stations li::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #4f8fd6}
.stations li.past{opacity:.45}.stations li.now{font-weight:700}.stations li.now::before{background:#ffd257}
.pop.tap{font-size:16px;color:#3b3340}
@media (max-width:640px){.tools{top:auto;bottom:88px;max-height:52%;left:16px;right:16px;width:auto}}
.taphint{position:absolute;transform:translateY(-50%);display:flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer;
  background:#fff8ec;border:2.5px solid #3b3340;box-shadow:0 4px 0 #3b3340;border-radius:14px;padding:5px 12px 5px 6px;font:400 18px var(--display);color:#3b3340;white-space:nowrap;animation:nudge 1.1s ease-in-out infinite}
.taphint::after{content:"";position:absolute;right:-12px;top:50%;width:0;height:0;border:7px solid transparent;border-left:10px solid #3b3340;transform:translateY(-50%)}
.taphint svg{transform:rotate(90deg)}
@keyframes nudge{0%,100%{margin-left:0}50%{margin-left:10px}}
@media (prefers-reduced-motion: reduce){.taphint{animation:none}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus-within{width:auto;height:auto;clip:auto;left:16px!important;top:120px!important;transform:none}
.plansign{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none}
.plansign .board{border:0;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px 6px;border-radius:8px;
  background:#2f6f9a;color:#eaf6ff;box-shadow:0 3px 0 #1d4a69,0 8px 16px rgb(0 0 0 / .25);
  background-image:linear-gradient(rgb(255 255 255 / .12) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .12) 1px,transparent 1px);background-size:10px 10px}
.plansign .board b{font:700 22px var(--mono);letter-spacing:.12em;line-height:1}
.plansign .board small{font-size:10.5px;opacity:.85}
.plansign .board.today{background-color:#f4efe2;color:#3a3a3a;box-shadow:0 3px 0 #c9bfa6,0 8px 16px rgb(0 0 0 / .25)}

/* ===== 像素积木风 ===== */
/* 所有框都用同一套像素瓦片：1 格描边、阶梯圆角、左上亮边、右下暗边、底下 2 格厚度。瓦片由脚本生成后放进变量里 */
.px,.pxc,.pxb{border-style:solid!important;border-color:transparent!important;border-radius:0!important;box-shadow:none!important;background:none!important;image-rendering:pixelated}
.px{border-width:12px 12px 18px!important;border-image:var(--t-panel) 4 4 6 fill/12px 12px 18px stretch!important}
.pxc{border-width:8px 8px 12px!important;border-image:var(--t-card) 4 4 6 fill/8px 8px 12px stretch!important}
.pxb{border-width:8px 8px 12px!important;border-image:var(--t-btn) 4 4 6 fill/8px 8px 12px stretch!important;transition:none!important}
.pxb:active:not([disabled]),.pxb.dn{border-image-source:var(--t-btn-dn)!important}
.pxb.or{border-image-source:var(--t-or)!important;color:#fff!important;text-shadow:1px 1px 0 #9a3d1c}
.pxb.or:active:not([disabled]){border-image-source:var(--t-or-dn)!important}
.pxb.bl{border-image-source:var(--t-bl)!important;color:#fff!important;text-shadow:1px 1px 0 #1d3d68}
.pxb.bl:active:not([disabled]){border-image-source:var(--t-bl-dn)!important}
.pxb.on,.pxb[aria-pressed="true"]{border-image-source:var(--t-on-dn)!important}
.pxb.dk{border-image-source:var(--t-dk)!important;color:#fff8ec!important}
.pxb.dk:active{border-image-source:var(--t-dk-dn)!important}
.pxb.rd{border-image-source:var(--t-rd)!important}
.pxb[disabled]{opacity:.5;cursor:default}
.num{font-family:"Fusion Pixel",monospace;letter-spacing:.02em}

/* 右下工具栏与房间里的按钮 */
.tbtn{width:60px;height:60px;padding:0;display:grid;place-items:center;margin:0}
.tbtn svg{image-rendering:pixelated}
.tbtn[data-tip]:hover::after,.tbtn[data-tip]:focus-visible::after{border-radius:0;background:#3b3340;box-shadow:0 0 0 2px #fff8ec,0 0 0 4px #3b3340;bottom:calc(100% + 14px)}

/* 导航：一列像素积木图标，不要底板 */
#lift{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:50%;z-index:14;transform:translate(calc(-100% - 30px),-50%);display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .26s cubic-bezier(.36,0,.66,-.56)}

@keyframes lcdUp{50%{transform:translateY(-2px)}}
.lbtn{--i:0;width:84px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3b3340;font:400 12.5px var(--display);
  transform:scale(.3);opacity:0;transition:transform .2s cubic-bezier(.36,0,.66,-.56),opacity .15s;transition-delay:calc((4 - var(--i)) * 25ms)}
#lift.on .lbtn{transform:none;opacity:1;transition:transform .42s cubic-bezier(.34,1.56,.64,1),opacity .2s;transition-delay:calc(var(--i) * 45ms + 90ms)}
.lbtn .tile{width:64px;height:64px;box-sizing:border-box;display:grid;place-items:center;border-style:solid;border-color:transparent;border-width:8px 8px 12px;border-image:var(--tile) 4 4 6 fill/8px 8px 12px stretch}
.lbtn:hover .tile{transform:translateY(-2px)}
.lbtn:active .tile,.lbtn.on .tile{border-image-source:var(--tile-dn)}
.lbtn .lab{padding:1px 7px;color:#fff8ec;background:#3b3340;box-shadow:0 0 0 2px #fff8ec}
.lbtn.on .lab{background:#f2784a}
.lbtn:focus-visible{outline:none}.lbtn:focus-visible .tile{outline:3px dashed #ef6b52;outline-offset:2px}
.lbtn.on .tile::after{content:"";position:absolute}
#liftPeek{position:fixed;left:0;top:50%;z-index:13;transform:translate(0,-50%);width:30px;height:56px;padding:0;cursor:pointer;display:grid;place-items:center;
  border-style:solid;border-color:transparent;border-width:8px 8px 12px 0;border-image:var(--t-btn) 4 4 6 0 fill/8px 8px 12px 0 stretch;background:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s}
#liftPeek.off{transform:translate(-110%,-50%);opacity:0;pointer-events:none}

  <script>
  /* 加载页的像素图：先于 3D 引擎运行，打开就有东西看 */
  (()=>{const L=document.getElementById('loading');if(!L)return;
    const P={k:'#3b3340',w:'#fff8ec',p:'#ffb3c1',y:'#ffd257',Y:'#e0a92e',r:'#e2665d',R:'#b8463e',o:'#f2784a',g:'#7cc35a',G:'#3e8a2a',d:'#ecc994',D:'#dcb07a',c:'#ffffff',C:'#e2f2ff',v:'#b9a8ee',V:'#a08fdc',n:'#ffd76a'};
    const svg=(rows,s,pal=P)=>{const H=rows.length,W=Math.max(...rows.map(r=>r.length));let r='';rows.forEach((row,y)=>{for(let x=0;x<row.length;x++){const c=pal[row[x]];if(c)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`}});
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W*s}" height="${H*s}" shape-rendering="crispEdges">${r}</svg>`};
    const url=s=>`url("data:image/svg+xml,${encodeURIComponent(s)}")`;
    /* 工人猫：安全帽 + 背上一块砖 */
    const top=['..yyyy..........','.yyyyyy.........','YYYYYYYY........','kwwwwwwk.rrrr...','kwkwwkwk.rRRr.kk','kwwwpwwkkkkkkkwk','.kwwwwwwwwwwwwk.','..kwwwwwwwwwwk..','..kwwwwwwwwwwk..'];
    const A=[...top,'..kwk..kwk.kwk..','..kk...kk...kk..'],B=[...top,'...kwk.kwk.kwk..','...kk..kk..kk...'];
    document.getElementById('ldCat').innerHTML=`<div class="ld-in">${svg(A,4)}<span class="f2">${svg(B,4)}</span></div>`;
    /* 标志：猫耳朵的楼。两扇深色窗户是眼睛，粉色小鼻子，大门是嘴 */
    const LOGO=['.k..............k.','kpk............kpk','kppk..........kppk','kwwwkkkkkkkkkkwwwk','kwwwwwwwwwwwwwwwwk','kwyywwyywwyywwyywk','kwyywwyywwyywwyywk','kwwwwwwwwwwwwwwwwk','kwwwwkkwwwwkkwwwwk','kwwwwkkwwwwkkwwwwk','kwyywwwwwppwwwyywk','kwyywwwwkwwkwwyywk','kwwwwwwwwkkwwwwwwk','kwyywwwkkkkwwwyywk','kwyywwwkDDkwwwyywk','kwwwwwwkDDkwwwwwwk','kkkkkkkkkkkkkkkkkk','.gggggggggggggggg.'];
    document.getElementById('ldLogo').innerHTML=svg(LOGO,4,{...P,D:'#a0703f'});
    /* 三层滚动背景：云、城市剪影、地面（每块 960px 宽，无缝拼接） */
    const cloud=['....cccc....','..cccccccc..','.ccccccccccc','cccccccccccC','.CCCCCCCCCC.'];
    let cl='';[[40,10,6],[330,40,4],[620,6,5],[820,52,3]].forEach(([x,y,s])=>{cl+=`<g transform="translate(${x} ${y}) scale(${s})">${svg(cloud,1).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`});
    L.querySelector('.ld-clouds').style.backgroundImage=url(`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="120" shape-rendering="crispEdges">${cl}</svg>`);
    let cl2='';[[180,20,3],[520,8,3],[760,30,2]].forEach(([x,y,s])=>{cl2+=`<g transform="translate(${x} ${y}) scale(${s})">${svg(cloud,1).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`});
    L.querySelector('.ld-clouds2').style.backgroundImage=url(`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="80" shape-rendering="crispEdges">${cl2}</svg>`);

    const t=i*Math.PI/180,x=12*Math.cos(t),y=4.5*Math.sin(t);

const MEL=[0,null,2,1,null,2,3,null, 2,null,1,null,0,null,null,null, 1,null,2,3,null,4,3,null, 2,null,1,0,null,null,null,null];
const music={on:false,duck:false,timer:null,next:0,step:0,
  want(){return !state.ui.mute&&state.ui.musicOn!==false&&!document.hidden},
  start(){const c=snd.init();if(!c||this.on)return;c.resume();this.on=true;this.next=c.currentTime+.15;this.step=0;this.timer=setInterval(()=>this.sched(),120)},
  stop(){this.on=false;clearInterval(this.timer)},
  sync(){if(this.want()&&snd.ctx)this.start();else this.stop()},
  sched(){const c=snd.ctx;if(!c)return;while(this.next<c.currentTime+.5){const K=MUSIC_KEYS[moodKey()]||MUSIC_KEYS.morning;if(!this.duck)this.note(this.step,this.next,K);this.next+=60/K.bpm/2;this.step++}},
  note(s,t,K){const c=snd.ctx,out=snd.bus.music,bar=Math.floor(s/8)%4,ch=K.prog[bar],hz=m=>440*Math.pow(2,(m-69)/12);
    const play=(m,d,type,v)=>{const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;o.type=type;o.frequency.value=hz(m);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(lp).connect(g).connect(out);o.start(t);o.stop(t+d+.05)};
    if(s%8===0)play(K.root-12+ch[0],1.1,'triangle',.16);if(s%8===4)play(K.root-12+ch[2]-12,.6,'triangle',.11);
    play(K.root+ch[(s%4===3?1:s%4)%3]+(s%8>=4?12:0),.28,'triangle',.045);
    const mi=MEL[s%32];if(mi!=null&&Math.floor(s/32)%2===1){const scale=[0,2,4,7,9,12];play(K.root+12+scale[(ch[0]%12===0?0:1)+mi]||K.root+12,.32,'square',.03)}}};

const BUILD_SECS=5;

const puffTex=canvasTex(32,32,(g,w,h)=>{g.clearRect(0,0,w,h);const px=(x,y,a)=>{g.fillStyle=`rgba(250,246,240,${a})`;g.fillRect(x*4,y*4,4,4)};
  const M=['..####..','.######.','########','########','########','########','.######.','..####..'];

const puffs=[]; for(let i=0;i<110;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:puffTex,transparent:true,depthWrite:false,opacity:0}));sp.visible=false;building.add(sp);puffs.push({sp,life:0,max:1})}

function spawnPuff(x,y,z,big){const p=puffs[puffI++%puffs.length];p.sp.position.set(x,y,z);p.life=0;p.max=0.8+Math.random()*0.8;p.vx=(Math.random()-.5)*0.7;p.vy=0.6+Math.random()*1.0;p.s0=(big?0.32:0.14)+Math.random()*0.18;
  p.sp.material.color.setRGB(1,1,1);p.sp.visible=true}
function tickPuffs(dt){for(const p of puffs){if(!p.sp.visible)continue;p.life+=dt;const k=p.life/p.max;if(k>=1){p.sp.visible=false;continue}
  p.sp.position.x+=p.vx*dt;p.sp.position.y+=p.vy*dt;p.vy*=0.97;const sc=p.s0*(1+k*1.1);p.sp.scale.set(sc,sc,1);p.sp.material.opacity=(k<.15?k/.15:1-(k-.15)/.85)*0.42}}
const CLANG=['哐啷','叮叮','咚咚','哐！','嘿咻'];
function tickConstruction(dt){
  const c=constructing; if(!c)return; c.t=(performance.now()-c.start)/1000; const f=c.f; f.grow=Math.min(1,c.t/BUILD_SECS);
  if(!floors.includes(f)){constructing=null;return}

  if(c.t>=BUILD_SECS&&f.grow>=1){constructing=null;f.root.position.x=0;
    for(let i=0;i<30;i++)spawnPuff(-4+Math.random()*8,f.y+Math.random()*f.hCur,2.7,true);
    toast(`${CAT[f.item.cat].zh}这一层盖好了，进屋开工吧`); setTimeout(()=>{if(session?.id===f.id&&catFloor===f&&focusF!==f)focusFloor(f)},450)}
}

function drawToday(){const el=$('twToday');if(!el)return;const rs=state.records,n=rs.length,m=rs.reduce((a,r)=>a+r.min,0);

/* 用自定义配色画像素图标（串门的朋友头像、证书上的猫爪印） */
function pxIconPal(k,size,pal){const rows=PXI[k],n=rows.length,w=Math.max(...rows.map(r=>r.length));let r='';
  rows.forEach((row,y)=>{for(let x=0;x<row.length;x++){const ch=row[x];const c=pal[ch]??PXP[ch];if(!c||ch==='.')continue;r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`}});
  return `<svg viewBox="0 0 ${w} ${n}" width="${size}" height="${size}" aria-hidden="true" shape-rendering="crispEdges" style="image-rendering:pixelated">${r}</svg>`}
function setupBoardScroll(){
 const body=fp.querySelector('.body'),track=fp.querySelector('.scroll-track'),thumb=fp.querySelector('.scroll-thumb');if(!body||!track)return;
 const update=()=>{const ratio=Math.min(1,body.clientHeight/body.scrollHeight);const height=Math.max(28,track.clientHeight*ratio);thumb.style.height=height+'px';thumb.style.top=(body.scrollTop/Math.max(1,body.scrollHeight-body.clientHeight)*(track.clientHeight-height))+'px'};
 body.addEventListener('scroll',update,{passive:true});if(fp._boardResize)fp._boardResize.disconnect();fp._boardResize=new ResizeObserver(update);fp._boardResize.observe(body);
 fp.querySelector('.scroll-up').onclick=()=>body.scrollBy({top:-150,behavior:'smooth'});
 fp.querySelector('.scroll-down').onclick=()=>body.scrollBy({top:150,behavior:'smooth'});
 track.onclick=e=>{if(e.target===track){const r=track.getBoundingClientRect();body.scrollTop=(e.clientY-r.top)/r.height*(body.scrollHeight-body.clientHeight)}};
 thumb.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const y=e.clientY,top=body.scrollTop;thumb.setPointerCapture(e.pointerId);thumb.onpointermove=m=>{body.scrollTop=top+(m.clientY-y)/Math.max(1,track.clientHeight-thumb.clientHeight)*(body.scrollHeight-body.clientHeight)};thumb.onpointerup=()=>{thumb.onpointermove=null}};
 requestAnimationFrame(update);
}
new MutationObserver(()=>setupBoardScroll()).observe(fp,{childList:true});

/* 习惯分析：只看已有记录，算出每天学多久、最爱几点学、最近趋势、常住房间、睡眠 */
function habitStats(){const days=dayRecs(),last7=days.slice(-7),prev7=days.slice(-14,-7);
  const catMin=(ds,k)=>ds.reduce((a,d)=>a+d.records.filter(r=>r.cat===k&&r.status!=='ruin').reduce((s,r)=>s+r.min,0),0);
  const study7=catMin(last7,'studyWork'),studyP=catMin(prev7,'studyWork'),sleep7=catMin(last7,'sleep');
  const hours=Array(24).fill(0);for(const d of days){let t=0;for(const r of d.records){if(r.cat==='studyWork')for(let m=t;m<t+r.min;m+=15)hours[Math.floor(m/60)%24]+=15;t+=r.min}}
  const bestH=hours.indexOf(Math.max(...hours));
  const by={};for(const d of last7)for(const r of d.records)if(r.cat!=='sleep')by[r.cat]=(by[r.cat]||0)+r.min;
  const tops=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const all=days.flatMap(d=>d.records),ruinRate=all.length?all.filter(r=>r.status==='ruin').length/all.length:0;
  const perDay=last7.map(d=>({d,m:d.records.filter(r=>r.cat==='studyWork'&&r.status!=='ruin').reduce((s,r)=>s+r.min,0)}));
  const trend=studyP?Math.round((study7-studyP)/studyP*100):null;
  return {days,study7,studyAvg:study7/Math.max(1,last7.length),sleepAvg:sleep7/Math.max(1,last7.length),bestH,hours,tops,ruinRate,perDay,trend}}
function catNote(h){const lines=[];
  lines.push(h.bestH<9?'你是早起学习型的猫，脑子最清醒的时候都给了学习。':h.bestH<14?'上午是你的黄金时段，学习房这时候最亮。':h.bestH<19?'下午才进入状态，属于慢热型的猫。':'夜猫子一只，越晚越精神。');
  if(h.trend!=null)lines.push(h.trend>=10?`这周比上周多学了 ${h.trend}%，楼盖得越来越高了。`:h.trend<=-10?`这周比上周少学了 ${-h.trend}%，累了就歇歇，不丢人。`:'这周和上周差不多，节奏很稳。');
  lines.push(h.sleepAvg<390?'最近睡得有点少，小猫建议早点熄灯。':'睡眠够了，地基打得很牢。');
  if(h.ruinRate>.12)lines.push('烂尾有点多，试试把一层拆小一点？');
  return lines}

let repSpan=7;
function fpReport(){const days=dayRecs().slice(-repSpan),all=days.flatMap(d=>d.records),tot=sumM(all)||1;
  const by={};all.forEach(r=>by[r.cat]=(by[r.cat]||0)+r.min);const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);const mx=rows[0]?.[1]||1;
  const nonSleep=rows.filter(([k])=>k!=='sleep');const big=days.reduce((a,d)=>sumM(d.records)>sumM(a.records)?d:a,days[0]);
  const ruinsN=all.filter(r=>r.status==='ruin').length;
  const line=`一栋${nonSleep[0]?CAT[nonSleep[0][0]].zh.replace('/工作','')+'楼':'空楼'}，睡觉打地基${big?`，${big.today?'今天':wk(dLabel(big.ago))}盖得最高`:''}。`;
  // 按顺序从 0 点排开每一天
  const heat=days.slice(-7).map(d=>{const cells=Array(24).fill(null);let t=0;for(const r of d.records){const a=t,b=t+r.min;for(let h=Math.floor(a/60);h<Math.min(24,Math.ceil(b/60));h++){const ov=Math.min(b,(h+1)*60)-Math.max(a,h*60);if(!cells[h]||ov>cells[h].ov)cells[h]={ov,c:r.status==='ruin'?'#c6bbb0':CAT[r.cat].c}}t=b}return {d,cells}});
  const hourBy=Array(24).fill(0);heat.forEach(h=>h.cells.forEach((c,i)=>{if(c&&c.c===CAT.studyWork.c)hourBy[i]++}));const bestH=hourBy.indexOf(Math.max(...hourBy));
  fp.innerHTML=fpShell('施工报告','',`
   <div class="tabs3">${[[7,'最近 7 天'],[14,'最近 14 天']].map(([n,t])=>`<button class="kbtn ${repSpan===n?'on':''}" data-span="${n}">${t}</button>`).join('')}</div>
   <div class="sumline"><small>这${repSpan===7?'一周':'两周'}的楼，像什么</small>${line}</div>
   <div class="rep4">
     <div style="--tc:#8f84d0">${uic('build',24)}<b>${fmtH(tot)}</b><span>一共</span></div>
     <div style="--tc:#5fae3e">${uic('std',24)}<b>${fmtH(tot/days.length)}</b><span>平均每天</span></div>
     <div style="--tc:#d8ab2f">${uic('sun',24)}<b>${bestH}点</b><span>最常学习</span></div>
     <button id="toRuins" style="--tc:#e2665d" title="去烂尾收藏馆">${uic('ruins',24)}<b>${ruinsN}层</b><span>烂尾 ›</span></button>
   </div>
   <div class="blk2" style="padding:12px 14px"><h3>一周 × 24 小时<small class="muted" style="float:right">每格一小时，颜色是那时住在哪间房</small></h3>
     <div class="heat">${heat.map(h=>`<div class="hr"><span>${h.d.today?'今天':wk(dLabel(h.d.ago))}</span><div class="cells">${h.cells.map(c=>`<i style="${c?'background:'+c.c:''}"></i>`).join('')}</div></div>`).join('')}
     <div class="ax"><span>0 点</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>
     <div class="legend" style="margin-top:8px">${CATS.map(c=>`<span><i style="background:${c.c}"></i>${c.zh}</span>`).join('')}<span><i style="background:#c6bbb0"></i>烂尾</span></div></div>
   <div class="blk2"><h3 style="margin:0 0 6px">住得最久的房间</h3><div class="bars">${rows.slice(0,5).map(([k,m])=>`<div><span>${CAT[k].zh}</span><span class="tr"><i style="width:${m/mx*100}%;background:${CAT[k].c}"></i></span><small>${fmtH(m)}</small></div>`).join('')}</div></div>
   <p class="muted" style="margin:0">今天是真实数据，之前的日子是示例。一天的楼从 0 点开始按顺序排开。</p>`);

@keyframes live{50%{opacity:.35}}
/* 烂尾馆：封存铭牌 */
#fp .ri .brass{display:inline-block;margin-top:.8cqw;padding:.3cqw 1.2cqw;font-size:1.9cqw;color:#5a3b12;background:linear-gradient(180deg,#f6dc95,#d9a94a);border:1px solid #a8782c;box-shadow:0 2px 0 #8a5f22,inset 0 1px 0 #fff5cf;align-self:flex-start}
#fp .ri .t{display:flex;flex-direction:column}
#fp .body .ruin-task .ruin-actions{max-width:56%;flex-wrap:wrap;justify-content:flex-end}
#fp .body .ri.sealed{background-color:#f3e6cf55!important;background-clip:padding-box!important}
#fp .body p.empty{padding:3cqw 2cqw!important;text-align:center;font-size:2.2cqw!important;line-height:1.7!important}
/* 选中状态统一：浅粉底 + 棕色描边 */
#fp .radio label{border:2px solid #ead6bd!important;border-image:none!important;background:#fffaf0!important;border-radius:0!important;padding:.6cqw 1cqw!important}
#fp .radio label.on{border:2px solid #c08c60!important;background:#ffd5d3!important;box-shadow:inset 0 0 0 2px #fff7e9!important}
#fp .body .fr.on{background-color:#ffd5d3aa!important}
/* ===== 选图纸弹窗 ===== */
.picker{position:absolute;box-sizing:border-box!important}
@media(max-width:600px){body.picker-open #lift,body.picker-open #liftPeek,body.picker-open #hud{opacity:0!important;pointer-events:none!important}}
.picker .pk-x{position:absolute;right:20px;top:20px;z-index:3;width:36px;height:36px;padding:0;display:grid;place-items:center;border:0;cursor:pointer;
  background:#ffe3dc;color:#3b3340;font:700 20px/1 Arial,sans-serif;box-shadow:0 0 0 2px #3b3340,0 4px 0 2px #3b3340}
.picker .pk-x:active{transform:translateY(3px);box-shadow:0 0 0 2px #3b3340,0 1px 0 2px #3b3340}
.picker.bp .pk-x{background:#dcebf4}
.picker h3::after{left:auto!important;right:-6px;margin-left:0!important}
.picker h3{margin-right:56px!important}
.picker .sheets{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px!important}
.picker .sheets .sheet{font-size:14px!important}
.picker .sheets .sheet{position:relative;outline:none!important;padding:4px 2px 6px!important;gap:2px!important;min-height:86px;justify-content:flex-end;
  background-color:color-mix(in srgb,var(--sc) 14%,#fffaf0)!important}
.picker .sheets .sheet .ic{width:46px;height:48px;image-rendering:pixelated;display:block;margin:0 auto;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.picker .sheets .sheet:hover .ic{transform:translateY(-4px)}
.picker .sheets .sheet[aria-pressed="true"] .ic{transform:translateY(-3px) scale(1.06)}
.picker .sheets .sheet .nm{display:block;max-width:100%;overflow:hidden;line-height:1.15;padding:0 2px;word-break:keep-all;overflow-wrap:anywhere;min-height:1.15em}
.picker .dur-h span{white-space:nowrap;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.picker .sheets .sheet.custom::before{content:"★";position:absolute;left:5px;top:2px;font-size:11px;color:var(--sc)}
.picker .sheets .sheet .cu-x{position:absolute;right:2px;top:0;width:18px;height:18px;font:700 13px/18px Arial;font-style:normal;color:#9a8f86;opacity:0;cursor:pointer}
.picker .sheets .sheet:hover .cu-x,.picker .sheets .sheet:focus-within .cu-x{opacity:1}
.picker .sheets .sheet.add{background:repeating-linear-gradient(135deg,#fffaf0 0 6px,#f6ecd9 6px 12px)!important;color:#8c6a4e!important}
.picker .sheets .sheet.add .plus{width:auto;height:54px;display:grid;place-items:center;font:700 30px/1 Arial;color:#c49a63}
/* 自定义编辑 */
.picker .cu-edit{display:flex;flex-direction:column;gap:8px;padding:10px;background:#fffaf0;box-shadow:0 0 0 2px #c49a63,0 4px 0 2px #c49a63}
.picker.bp .cu-edit{color:#173548}
.picker .cu-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:#60412c}
.picker .cu-row input{flex:1;min-width:0;padding:8px 10px;border:2px solid #c49a63;background:#fff;font:15px var(--body);color:#4a3327}
.picker .cu-rooms{display:flex;gap:4px;flex-wrap:wrap}
.picker .cu-room{width:38px;height:38px;padding:2px;border:2px solid transparent;background:#f6ecd9;cursor:pointer}
.picker .cu-room img{width:100%;height:100%;image-rendering:pixelated}
.picker .cu-room[aria-pressed="true"]{border-color:#3b3340;background:#ffe9a8}
.picker .cu-row:last-child{justify-content:flex-end}
.picker .cu-cancel,.picker .cu-save{padding:7px 14px;border:0;font:15px var(--display);cursor:pointer;box-shadow:0 0 0 2px #3b3340,0 3px 0 2px #3b3340}
.picker .cu-cancel{background:#fffaf0;color:#3b3340}.picker .cu-save{background:#f2845f;color:#fff}
/* 时长滑块 */
.picker .quick-add2{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 8px;background:#fffaf0;box-shadow:0 0 0 2px #e0c9a6}
.picker.bp .quick-add2{background:#eaf3f9;box-shadow:0 0 0 2px #9cc0d8;color:#173548}
.picker .dur{flex:1;min-width:0}
.picker .dur-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600;color:#60412c}
.picker.bp .dur-h{color:#2b5674}
.picker .dur-v{font:800 18px var(--body);color:#c4562e;font-variant-numeric:tabular-nums;white-space:nowrap}
.picker.bp .dur-v{color:#2f64a6}
.picker .dur-track{padding:6px 0 2px}
.picker .dur-r{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;background:transparent;cursor:pointer;--p:30%}
.picker .dur-r::-webkit-slider-runnable-track{height:10px;background:linear-gradient(90deg,#f2845f 0 var(--p),#ead9bf var(--p));box-shadow:0 0 0 2px #3b3340}
.picker .dur-r::-moz-range-track{height:10px;background:#ead9bf;box-shadow:0 0 0 2px #3b3340}
.picker .dur-r::-moz-range-progress{height:10px;background:#f2845f}
.picker.bp .dur-r::-webkit-slider-runnable-track{background:linear-gradient(90deg,#4f8fd6 0 var(--p),#cfe0ee var(--p))}
.picker .dur-r::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border:0;background:var(--sticker-cat) center/100% 100% no-repeat,#fff8ec;box-shadow:0 0 0 2px #3b3340,0 3px 0 2px #3b3340;image-rendering:pixelated}
.picker .dur-r::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:0;background:var(--sticker-cat) center/100% 100% no-repeat,#fff8ec;box-shadow:0 0 0 2px #3b3340}
.picker .dur-r:focus-visible{outline:2px dashed #ef6b52;outline-offset:4px}
.picker .dur-t{position:relative;height:14px;margin-top:4px;font-size:11px;color:#9a7a5e}
.picker.bp .dur-t{color:#5d81a0}
.picker .dur-t span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.picker .dur-t span:first-child{transform:none}.picker .dur-t span:last-child{transform:translateX(-100%)}
/* ===== 说一段话 → 一层层 ===== */
.picker .say-box{background:#fffaf0;box-shadow:0 0 0 2px #c49a63;padding:6px 10px}
.picker.bp .say-box{background:#eaf3f9;box-shadow:0 0 0 2px #9cc0d8;color:#173548}
.picker .say-box summary{display:flex;align-items:center;gap:6px;cursor:pointer;font:400 15px var(--display);color:#60412c;list-style:none}
.picker.bp .say-box summary{color:#2b5674}
.picker .say-box summary::-webkit-details-marker{display:none}
.picker .say-box summary::after{content:"▾";margin-left:auto;font:12px Arial}.picker .say-box[open] summary::after{content:"▴"}
.picker .say-box textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:8px;border:0;box-shadow:0 0 0 2px #c49a63;background:#fff;font:14px/1.5 var(--body);color:#4a3327;resize:vertical}
.picker .say-row{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.picker .say-row button,.picker .say-prev .ok button{border:0;padding:6px 12px;cursor:pointer;font:400 14px var(--display);box-shadow:0 0 0 2px #3b3340,0 3px 0 2px #3b3340}
.picker .say-mic{background:#fff;color:#3b3340}.picker .say-mic.on{background:#ffe0d6;color:#c4562e;animation:live 1s infinite}
.picker .say-go{background:#f2845f;color:#fff}.picker.bp .say-go{background:#4f8fd6}
.picker .say-prev{list-style:none;margin:8px 0 2px;padding:0;display:flex;flex-direction:column;gap:5px}
.picker .say-prev li{display:flex;align-items:center;gap:6px;padding:3px 6px;background:color-mix(in srgb,var(--sc) 18%,#fffaf0);box-shadow:0 0 0 2px color-mix(in srgb,var(--sc) 55%,#fff);font:13px var(--body);color:#3b3340}
.picker .say-prev li img{width:26px;height:27px;image-rendering:pixelated}
.picker .say-prev li span{flex:1;min-width:0;overflow-wrap:anywhere}.picker .say-prev li b{font-weight:400;color:#805034}
.picker .say-prev li button{border:0;background:none;color:#9a8f86;cursor:pointer;font:15px Arial}
.picker .say-prev li .cat{padding:0;border:0;background:none;cursor:pointer;display:grid}
.picker .say-prev li .cat:hover img{transform:translateY(-2px) rotate(-6deg)}
.picker .say-prev li.unsure{box-shadow:0 0 0 2px #e0b23a;background:#fff4cf}
.picker .say-prev li.warn{background:none;box-shadow:none;padding:0;color:#b07a1a;font-size:12.5px}
.picker .say-prev li.ok{background:none;box-shadow:none;justify-content:flex-end;padding:4px 0 0}
.picker .say-prev .ok button{background:#7cc35a;color:#fff}
/* ===== 图纸卡片：房间色淡底（悬停/选中加深）+ 道具小动画 ===== */
.picker .sheets .sheet{isolation:isolate}
.picker .sheets .sheet::after{content:"";position:absolute;inset:0;background:var(--sc);opacity:.14;z-index:-1;pointer-events:none;transition:opacity .15s}
.picker .sheets .sheet:hover::after,.picker .sheets .sheet:focus-visible::after{opacity:.28}
.picker .sheets .sheet[aria-pressed="true"]{border-image-source:var(--t-card)!important}
.picker .sheets .sheet[aria-pressed="true"]::after{opacity:.42}
.picker .sheets .sheet[aria-pressed="true"] .nm{color:#2a1e18}
.picker .sheets .sheet.add::after{display:none}
.picker .sheets .sheet .ic{position:relative!important;display:block;width:46px;height:48px;margin:0 auto}
.picker .sheets .sheet .ic img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.picker .sheets .sheet .sc-prop{transform-origin:50% 60%}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-base{animation:sc-bob .5s steps(2) infinite}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-sleep .sc-prop{animation:sc-zzz 1.1s steps(4) infinite}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-meal .sc-prop{animation:sc-raise .7s ease-in-out infinite;transform-origin:70% 75%}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-social .sc-prop{animation:sc-hop .5s steps(3) infinite}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-studyWork .sc-prop{animation:sc-push .8s steps(2) infinite}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-commute .sc-prop{animation:sc-tilt .6s steps(2) infinite}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-outdoor .sc-prop{animation:sc-sway .9s ease-in-out infinite;transform-origin:80% 70%}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-entertainment .sc-prop{animation:sc-shake .25s steps(2) infinite}
.picker .sheets .sheet:is(:hover,:focus-visible) .sc-home .sc-prop{animation:sc-wiggle .6s steps(2) infinite}
@keyframes sc-bob{50%{transform:translateY(-2px)}}
@keyframes sc-zzz{0%{transform:translate(0,0);opacity:1}50%{transform:translate(2px,-5px);opacity:.8}100%{transform:translate(4px,-9px);opacity:0}}
@keyframes sc-raise{50%{transform:rotate(-14deg) translate(-2px,-5px)}}
@keyframes sc-hop{50%{transform:translateY(-6px)}}
@keyframes sc-push{50%{transform:translateY(-3px)}}
@keyframes sc-tilt{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
@keyframes sc-sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes sc-shake{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
@keyframes sc-wiggle{0%{transform:rotate(-10deg) scale(1.05)}100%{transform:rotate(10deg) scale(1.05)}}
/* ===== 像素滑块：分格的进度，猫头拖柄不要外框 ===== */
.picker .dur-r::-webkit-slider-runnable-track{height:12px!important;box-shadow:0 0 0 2px #3b3340!important;
  background:linear-gradient(90deg,transparent 0 var(--p),#ead9bf var(--p)),repeating-linear-gradient(90deg,#f2845f 0 8px,#d9653e 8px 10px)!important}
.picker.bp .dur-r::-webkit-slider-runnable-track{background:linear-gradient(90deg,transparent 0 var(--p),#cfe0ee var(--p)),repeating-linear-gradient(90deg,#4f8fd6 0 8px,#2f64a6 8px 10px)!important}
.picker .dur-r::-moz-range-progress{background:repeating-linear-gradient(90deg,#f2845f 0 8px,#d9653e 8px 10px)}
.picker .dur-r::-webkit-slider-thumb{width:30px!important;height:30px!important;margin-top:-9px!important;background:var(--sticker-cat) center/100% 100% no-repeat!important;box-shadow:none!important;filter:drop-shadow(0 2px 0 rgb(59 51 64 / .45))}
.picker .dur-r::-moz-range-thumb{background:var(--sticker-cat) center/100% 100% no-repeat!important;box-shadow:none!important}
/* 计时方式 */
.picker .tmode-row{display:flex;flex-direction:column;gap:8px}
.picker .tmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.picker .tmode{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border:0;cursor:pointer;background:#fffaf0;color:#4a3327;font:400 15px var(--display);box-shadow:0 0 0 2px #c49a63,0 3px 0 2px #c49a63}
.picker .tmode svg{flex:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.picker .tmode:hover svg{transform:rotate(-10deg) scale(1.1)}
.picker .tmode[aria-pressed="true"]{background:#ffe9a8;box-shadow:0 0 0 2px #3b3340,0 3px 0 2px #3b3340}
.picker .tm-extra{padding:8px 10px;background:#fffaf0;box-shadow:0 0 0 2px #e0c9a6}
.picker .tm-pomo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:#60412c}
.picker .tm-pomo[hidden],.picker .tm-down[hidden]{display:none}
.picker .pomo-opt{display:flex;align-items:center;gap:4px;padding:5px 8px;border:0;cursor:pointer;background:#fff;color:#4a3327;box-shadow:0 0 0 2px #e0c9a6;font:13px var(--body)}
.picker .pomo-opt b{font-size:15px}.picker .pomo-opt small{font-size:11px;color:#9a7a5e}
.picker .pomo-opt[aria-pressed="true"]{background:#ffe0d6;box-shadow:0 0 0 2px #e2665d}
/* 房间里的计时牌：番茄 / 休息 / 超时 */
.site.tm-is-pomo .t::before{content:"";display:inline-block;width:26px;height:26px;margin-right:6px;vertical-align:-3px;background:var(--tomato-ic) center/100% no-repeat;image-rendering:pixelated}
.site.tm-is-brk .t{color:#3e8a2a}.site.tm-is-over .t{color:#e2665d}
/* 弹窗不超出屏幕：太高就在里面滚动 */
.picker{max-height:calc(100dvh - 96px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
@media(max-height:820px){.picker .sheets .sheet{min-height:70px}.picker .sheets .sheet .ic{width:38px;height:40px}.picker{gap:8px!important}}
/* "补上这一层"：绿色、带小楼图标，和橙色的"开工"区分开 */
.picker .add-go{flex:none;display:flex;align-items:center;gap:6px;height:46px;padding:0 12px;border:0;cursor:pointer;
  background:#7cc35a;color:#fff;font:400 16px var(--display);text-shadow:1px 1px 0 #3e8a2a;box-shadow:0 0 0 2px #3b3340,0 4px 0 2px #3b3340,inset 0 3px 0 #a6e083,inset 0 -4px 0 #5a9e3e}
.picker .add-go:hover svg{transform:translateY(-2px)}.picker .add-go svg{transition:transform .15s}
.picker .add-go:active{transform:translateY(3px);box-shadow:0 0 0 2px #3b3340,0 1px 0 2px #3b3340,inset 0 3px 0 #a6e083}
.picker .quick-add,.picker .side.quick-add{display:none!important}
@media(max-width:420px){.picker .sheets{grid-template-columns:repeat(3,minmax(0,1fr))!important}.picker .sheets .sheet .ic{width:40px;height:42px}.picker .sheets .sheet{min-height:72px}.picker .quick-add2{flex-wrap:wrap}.picker .add-go{width:100%;justify-content:center}}
/* ===== 右下角：最常用的三个 ===== */
#hud{align-items:flex-end!important}
#hud #hToggle[aria-pressed="true"],#hud #planToggle[aria-pressed="true"]{border-image-source:var(--t-on-dn)!important}
#hud #buildBtn{position:relative;height:62px;display:flex;align-items:center;gap:8px;padding:0 14px 0 10px;font:400 19px var(--display);cursor:pointer;white-space:nowrap}
#hud #buildBtn svg{filter:drop-shadow(1px 1px 0 #9a3d1c)}
#hud #buildBtn b{font-family:Consolas,"Courier New",monospace;font-weight:700;letter-spacing:1px}
#hud #buildBtn.live{border-image-source:var(--t-bl)!important;text-shadow:1px 1px 0 #1d3d68}
#hud #buildBtn.live::before{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;background:#7ee06a;box-shadow:0 0 6px #7ee06a;animation:live 1.2s infinite}
/* 房间里的"放到桌面"按钮：第一次开工时轻轻晃一下提示 */
#floorbar .desk-btn.nudge{animation:desk-nudge 1.6s ease-in-out 4}
@keyframes desk-nudge{0%,60%,100%{transform:none}70%{transform:translateY(-6px) rotate(-6deg)}80%{transform:translateY(0) rotate(5deg)}}
/* 告示板上给小猫走的窗台：纸张上沿 */
#fp .cat-ledge{position:absolute;left:7%;right:12%;top:23.6%;height:0;z-index:6}
#fp .cat-ledge .roofcat{bottom:-4px}#fp .cat-ledge .rc-poop{bottom:-3px}
#fp .cat-ledge .rc-say{font-family:"Fusion Pixel","Microsoft YaHei",sans-serif!important}
/* ===== 左上角时钟：今天的状态 ===== */
.tw-today{margin-top:3px;font:500 13px var(--body);color:#fffaf2;opacity:.95;display:flex;align-items:center;gap:6px}
.tw-today b{font-weight:800;color:#ffe08a;font-size:14px}
.tw-live{width:8px;height:8px;background:#7ee06a;box-shadow:0 0 6px #7ee06a;animation:live 1.2s ease-in-out infinite;display:inline-block}
/* ===== 字体：标题和大数字用 Fusion Pixel（像素体，12px 的整数倍最清楚），正文用系统黑体 ===== */
#fp .sheetw .body :is(.stats3 b,.grid2 b){font-family:"Fusion Pixel","Microsoft YaHei",sans-serif!important;font-weight:400!important;font-size:4.8cqw!important;letter-spacing:.05em}
#fp header h2,#fp header h2 *{font-weight:400!important}
.timew.mcard .tw-time{font-family:"Fusion Pixel",Consolas,monospace!important;font-weight:400!important}
#hud #buildBtn b,.timew.mcard .tw-livebar b,.d-top .d-time{font-family:"Fusion Pixel",Consolas,monospace!important;font-weight:400!important}
/* ===== 左上角：像素卡片（头像 · 时间 · 天空 · 今天的楼 · 连续天数） ===== */
.timew.mcard{display:grid!important;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 10px!important;align-items:center;min-width:250px;max-width:300px;
  padding:10px 12px 10px 10px!important;background:#fff8ec!important;color:#3b3340!important;text-shadow:none!important;border:0!important;backdrop-filter:none!important;
  box-shadow:0 0 0 3px #3b3340,0 6px 0 3px #3b3340,0 14px 24px rgb(20 12 40 / .18)!important;border-radius:0!important}
.timew.mcard::before{content:"";position:absolute;left:10px;right:10px;top:3px;height:3px;background:#fff;opacity:.7;pointer-events:none}
.timew.mcard{position:relative}
.timew.mcard #twIcon{grid-row:1;grid-column:1;pointer-events:auto!important;cursor:pointer!important;width:58px!important;height:52px!important;padding:3px!important;
  background:#ffe9d6!important;box-shadow:0 0 0 2px #3b3340,inset 0 -4px 0 #f6cdb0!important;transition:transform .15s;display:grid;place-items:center}
.timew.mcard #twIcon:hover{transform:rotate(-5deg) scale(1.05)}
.timew.mcard #twIcon svg{width:50px;height:auto;filter:none!important}
.timew.mcard .tw-main{min-width:0}
.timew.mcard .tw-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timew.mcard .tw-time{font-size:36px!important;line-height:1;color:#3b3340;letter-spacing:1px}
.timew.mcard .tw-mood{position:relative;margin:0!important;width:36px;height:36px;padding:0!important;display:grid;place-items:center;cursor:pointer;
  background:#dff1ff!important;border:0!important;border-image:none!important;box-shadow:0 0 0 2px #3b3340,0 3px 0 2px #3b3340!important;transition:transform .15s}
