name: Import MEELO source handoff
on:
  push:
    branches: [main]
    paths: ['__handoff_bundle/READY.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify source bundle
        run: |
          node <<'JS'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const m=JSON.parse(fs.readFileSync('__handoff_bundle/READY.json','utf8'));
          const parts=Array.from({length:m.parts},(_,i)=>fs.readFileSync('__handoff_bundle/part-'+String(i).padStart(4,'0')+'.bin'));
          const b=Buffer.concat(parts);
          if(crypto.createHash('sha256').update(b).digest('hex')!==m.sha256)throw Error('Bundle checksum mismatch');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'meelo-web.bundle'),b);
          JS
          git bundle verify "$RUNNER_TEMP/meelo-web.bundle"
      - name: Import complete project and validate build
        run: |
          git fetch "$RUNNER_TEMP/meelo-web.bundle" main:refs/remotes/handoff/source
          git checkout refs/remotes/handoff/source -- .
          git rm -r --ignore-unmatch __handoff_bundle
          git rm --ignore-unmatch .github/workflows/import-handoff.yml
          npm run build:web
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete MEELO web source and development assets'
          git push origin HEAD:main

